{% extends "layout.html" %}
{% block page_class %}page-narrow{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Create account</h1>
    <p class="sub">Free customer account for the AI Dancing portal.</p>
    <form id="registerForm">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="1" maxlength="50" autocomplete="username">
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            <span class="help">At least 8 characters.</span>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" autocomplete="new-password">
            <span id="passwordError" class="error hidden">Passwords do not match.</span>
        </div>
        <button type="submit" class="btn btn-primary">Sign up</button>
    </form>
    <p class="auth-foot">
        Already have an account? <a href="{{ url_for('login_page') }}">Log in</a>
    </p>
</div>
{% endblock %}
{% block scripts %}
<script type="module">
    import { getErrorMessage, showToast } from "/static/js/utils.js";

    const registerForm = document.getElementById("registerForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const passwordError = document.getElementById("passwordError");

    function passwordsMatch() {
        const ok = passwordInput.value === confirmPasswordInput.value;
        passwordError.classList.toggle("hidden", ok);
        confirmPasswordInput.setCustomValidity(ok ? "" : "Passwords do not match");
        return ok;
    }

    confirmPasswordInput.addEventListener("input", passwordsMatch);

    registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!passwordsMatch()) return;

        const formData = new FormData(registerForm);
        const userData = {
            username: formData.get("username"),
            email: formData.get("email"),
            password: formData.get("password"),
        };

        try {
            const response = await fetch("/api/users", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(userData),
            });
            if (response.ok) {
                showToast("Account created. Please log in.", "ok");
                window.location.href = "/login";
            } else {
                const error = await response.json();
                showToast(getErrorMessage(error), "error");
            }
        } catch {
            showToast("Network error. Please try again.", "error");
        }
    });
</script>
{% endblock %}
