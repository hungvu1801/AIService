{% extends "layout.html" %}
{% block page_class %}page-narrow{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Forgot password</h1>
    <p class="sub">Enter your email and we will send a reset link if the account exists.</p>
    <form id="forgotPasswordForm">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Send reset link</button>
    </form>
    <p class="auth-foot">
        Remembered it? <a href="{{ url_for('login_page') }}">Log in</a>
    </p>
</div>
{% endblock %}
{% block scripts %}
<script type="module">
    import { getErrorMessage, showToast } from "/static/js/utils.js";

    const forgotPasswordForm = document.getElementById("forgotPasswordForm");
    const submitBtn = document.getElementById("submitBtn");

    forgotPasswordForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";
        const data = Object.fromEntries(new FormData(forgotPasswordForm).entries());
        try {
            const response = await fetch("/api/users/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            });
            if (response.status === 202) {
                showToast("If that email exists, reset instructions are on the way.", "ok");
                forgotPasswordForm.reset();
            } else {
                const error = await response.json();
                showToast(getErrorMessage(error), "error");
            }
        } catch {
            showToast("Network error. Please try again.", "error");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Send reset link";
        }
    });
</script>
{% endblock %}
