{% extends "layout.html" %}
{% block page_class %}page-narrow{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Reset password</h1>
    <p class="sub">Choose a new password for your account.</p>
    <form id="resetPasswordForm">
        <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" name="new_password" required minlength="8" autofocus>
            <span class="help">At least 8 characters.</span>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirm_password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Reset password</button>
    </form>
    <p class="auth-foot">
        <a href="{{ url_for('login_page') }}">Back to login</a>
    </p>
</div>
{% endblock %}
{% block scripts %}
<script type="module">
    import { getErrorMessage, showToast } from "/static/js/utils.js";

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");
    const submitBtn = document.getElementById("submitBtn");

    if (!token) {
        showToast("Invalid or missing reset token. Request a new one.", "error");
        submitBtn.disabled = true;
    }

    document.getElementById("resetPasswordForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        if (newPassword !== confirmPassword) {
            showToast("Passwords do not match.", "error");
            return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "Resetting...";
        try {
            const response = await fetch("/api/users/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, new_password: newPassword }),
            });
            if (response.ok) {
                showToast("Password updated. You can log in now.", "ok");
                window.location.href = "/login";
            } else {
                const error = await response.json();
                showToast(getErrorMessage(error), "error");
            }
        } catch {
            showToast("Network error. Please try again.", "error");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Reset password";
        }
    });
</script>
{% endblock %}
