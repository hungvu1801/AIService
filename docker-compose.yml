services:
  postgres:
    image: postgres:16
    container_name: aidancing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aidancing
      POSTGRES_PASSWORD: aidancing
      POSTGRES_DB: aidancing
    ports:
      - "5432:5432"
    volumes:
      - aidancing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidancing -d aidancing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aidancing_pgdata:
