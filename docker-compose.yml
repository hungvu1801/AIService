services:
  postgres:
    image: postgres:16
    container_name: aidancing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpass
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - aidancing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d blog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aidancing_pgdata:
